# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate daily cache key
        id: cache-date
        run: echo "bucket=$(($(date -u +%s) / 86400))" >> "$GITHUB_OUTPUT"

      - name: Cache Bun dependencies for 24 hours
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            cf-proxy/node_modules
          key: bun-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('package.json', 'cf-proxy/bun.lock') }}-${{ steps.cache-date.outputs.bucket }}
      
      - name: Install dependencies
        run: bun install

      - name: Install Cloudflare proxy dependencies
        run: bun install --cwd cf-proxy --frozen-lockfile

      - name: Run tests
        run: bun test
