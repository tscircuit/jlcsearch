# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install

      - name: Cache setup artifacts
        id: cache-setup
        uses: actions/cache@v4
        with:
          path: ./db.sqlite3
          key: db-sqlite3-${{ hashFiles('scripts/setup-*.ts') }}
          restore-keys: |
            db-sqlite3-

      - name: Run setup if cache miss
        if: steps.cache-setup.outputs.cache-hit != 'true'
        env:
          JLCSEARCH_SKIP_DERIVED_TABLE_POPULATE: "true"
          JLCSEARCH_SKIP_VACUUM: "true"
        run: |
          if [ -f db.sqlite3 ]; then
            echo "Using restored db.sqlite3 cache"
          else
            bun run setup
          fi

      - name: Run tests
        run: bun test
