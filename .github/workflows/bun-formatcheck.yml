# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate daily cache key
        id: cache-date
        run: echo "bucket=$(($(date -u +%s) / 86400))" >> "$GITHUB_OUTPUT"

      - name: Cache Bun dependencies for 24 hours
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('package.json') }}-${{ steps.cache-date.outputs.bucket }}

      - name: Install dependencies
        run: bun install

      - name: Run format check
        run: bun run format:check
