name: Diagnose stock table discovery
on:
  push:
    branches: [ops/verify-stock-c221660]
    paths: [.github/workflows/diagnose-stock-sync.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install worker dependencies
        run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Read D1 discovery error
        working-directory: cf-proxy
        run: |
          query="$(bun ../scripts/generate-stock-sync-sql.ts --print-targets-query)"
          result_file="${RUNNER_TEMP}/stock-targets.json"
          set +e
          bunx wrangler d1 execute jlcsearch --remote --json --command "${query}" > "${result_file}" 2>&1
          status=$?
          set -e
          cat "${result_file}"
          echo "Discovery exit status: ${status}"
          bunx wrangler d1 execute jlcsearch --remote --json --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('switch', 'search_index', 'component_catalog');"
          exit "${status}"
