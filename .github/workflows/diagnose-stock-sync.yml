name: Verify repaired stock sync for C221660
on:
  push:
    branches: [ops/verify-stock-c221660]
    paths: [.github/workflows/diagnose-stock-sync.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install worker dependencies
        run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Verify the repaired stock sync for C221660
        env:
          SOURCE_DB_PATH: ${{ runner.temp }}/c221660.sqlite3
          STOCK_BATCH_ROWS: "1"
          RETRY_MAX_ATTEMPTS: "1"
        run: |
          # Use the C221660 quantity recorded in the full prepared snapshot:
          # https://github.com/tscircuit/jlcsearch/actions/runs/38007299250
          bun -e 'import { Database } from "bun:sqlite"; const db = new Database(process.env.SOURCE_DB_PATH); db.exec("CREATE TABLE component_stock (lcsc INTEGER PRIMARY KEY, stock INTEGER); INSERT INTO component_stock VALUES (221660, 2184);"); db.close();'
          bash cf-proxy/scripts/sync-stock.sh
          cd cf-proxy
          bunx wrangler d1 execute jlcsearch --remote --json \
            --command "SELECT 'search_index' AS source, lcsc, stock, NULL AS in_stock FROM search_index WHERE lcsc=221660 UNION ALL SELECT 'component_catalog', lcsc, stock, NULL FROM component_catalog WHERE lcsc=221660 UNION ALL SELECT 'switch', lcsc, stock, in_stock FROM switch WHERE lcsc=221660;"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://jlcsearch.tscircuit.com/api/search?q=C221660&limit=1&cachebust=1"
