name: Refresh live inventory

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum website pages (100 parts per page)
        type: number
        default: 1000
      pages_per_category:
        description: Maximum pages per category visit before rotating
        type: number
        default: 1000
  pull_request:
    paths:
      - "scripts/crawl-live-stock.ts"
      - "scripts/refresh-requested-stock.ts"
      - "cf-proxy/src/requested-stock.ts"
      - "cf-proxy/src/cache-entry.ts"
      - "cf-proxy/test/cache-service.test.ts"
      - ".github/workflows/live-stock.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Validate live website inventory response
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/crawl-live-stock.ts --probe
      - run: bun test tests/requested-stock.test.ts
      - run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Verify inventory cache expiration
        working-directory: cf-proxy
        run: bunx vitest run test/cache-service.test.ts

  refresh:
    name: Rotate through live stock categories
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: production-d1-sync
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_STOCK_MAX_PAGES: ${{ inputs.max_pages || '1000' }}
      LIVE_STOCK_PAGES_PER_CATEGORY: ${{ inputs.pages_per_category || '1000' }}
      LIVE_STOCK_REPORT_PATH: ${{ github.workspace }}/live-stock-report.json
      REQUESTED_STOCK_REPORT_PATH: ${{ github.workspace }}/requested-stock-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Apply live inventory migrations
        working-directory: cf-proxy
        run: bash scripts/retry-command.sh bunx wrangler d1 migrations apply jlcsearch --remote
      - name: Refresh recently requested BOM parts
        run: bun scripts/refresh-requested-stock.ts
      - name: Refresh categories and expire old observations
        if: ${{ !cancelled() }}
        run: bun scripts/crawl-live-stock.ts
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-coverage
          path: |
            live-stock-report.json
            requested-stock-report.json
          if-no-files-found: warn
      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -s live-stock-report.json ]]; then
            echo '### Live stock coverage' >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat live-stock-report.json >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
