name: Refresh live inventory

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum website pages (100 parts per page)
        type: number
        default: 1000
      pages_per_category:
        description: Maximum pages per category visit before rotating
        type: number
        default: 1000
      cleanup_max_pages:
        description: Unverified-stock cleanup pages (1000 parts each, 0 disables; 0-1000)
        type: number
        default: 5
      popular_only:
        description: Refresh from the top 100 popular parts per category (up to 300 this run)
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/crawl-live-stock.ts"
      - "scripts/expire-unverified-stock.ts"
      - "scripts/stock-cleanup-query.ts"
      - "scripts/stock-cleanup-targets.ts"
      - "tests/live-stock-run.test.ts"
      - "tests/live-stock-workflow.test.ts"
      - "scripts/refresh-requested-stock.ts"
      - "cf-proxy/migrations/0028_requested_stock_popularity.sql"
      - "tests/requested-stock.test.ts"
      - "cf-proxy/src/requested-stock.ts"
      - "cf-proxy/src/cache-entry.ts"
      - "cf-proxy/test/cache-service.test.ts"
      - ".github/workflows/live-stock.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Validate live website inventory response
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/crawl-live-stock.ts --probe
      - run: bun test tests/requested-stock.test.ts
      - run: bun test tests/stock-cleanup.test.ts tests/stock-cleanup-query.test.ts tests/stock-cleanup-targets.test.ts tests/live-stock-run.test.ts tests/live-stock-workflow.test.ts
      - run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Verify inventory cache expiration
        working-directory: cf-proxy
        run: bunx vitest run test/cache-service.test.ts test/requested-stock.test.ts

  refresh:
    name: Rotate through live stock categories
    if: github.event_name != 'pull_request' && !inputs.popular_only
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: production-d1-sync
      cancel-in-progress: false
      # Preserve waiting rebuilds when another production job joins the queue.
      queue: max
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_STOCK_MAX_PAGES: ${{ inputs.max_pages || '1000' }}
      LIVE_STOCK_PAGES_PER_CATEGORY: ${{ inputs.pages_per_category || '1000' }}
      # Convert the numeric input to text before the fallback, preserving 0.
      LIVE_STOCK_CLEANUP_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.cleanup_max_pages) || '5' }}
      LIVE_STOCK_REPORT_PATH: ${{ github.workspace }}/live-stock-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Apply live inventory migrations
        working-directory: cf-proxy
        run: bash scripts/retry-command.sh bunx wrangler d1 migrations apply jlcsearch --remote
      - name: Refresh categories and expire old observations
        run: bun scripts/crawl-live-stock.ts
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-coverage
          path: live-stock-report.json
          if-no-files-found: warn
      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -s live-stock-report.json ]]; then
            echo '### Live stock coverage' >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat live-stock-report.json >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi

  requested:
    name: Refresh requested BOM inventory
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Exact refreshes use no shared staging table and must not wait behind a
    # multi-hour catalog import or a stalled category crawl.
    concurrency:
      group: requested-live-stock
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REQUESTED_STOCK_REPORT_PATH: ${{ github.workspace }}/requested-stock-report.json
      REQUESTED_STOCK_POPULAR_ONLY: ${{ inputs.popular_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Refresh recently requested BOM parts
        run: bun scripts/refresh-requested-stock.ts
      - name: Save requested inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-stock-coverage
          path: requested-stock-report.json
          if-no-files-found: warn
