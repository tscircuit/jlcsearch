name: Preview live inventory coverage
on:
  push:
    branches: [ops/preview-live-inventory]
    paths: [.github/workflows/preview-live-inventory.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Read production taxonomy and compare live inventory pages
        run: bun scripts/crawl-live-stock.ts --preview
      - uses: actions/upload-artifact@v4
        with:
          name: live-stock-preview
          path: live-stock-report.json
# Collect website taxonomy diagnostics.
