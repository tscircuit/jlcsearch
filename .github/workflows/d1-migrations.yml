name: Build and Sync D1

on:
  schedule:
    # Runs after the upstream jlcparts 03:00 UTC refresh has completed.
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "bunfig.toml"
      - "cf-proxy/migrations/**"
      - "cf-proxy/scripts/**"
      - "cf-proxy/wrangler.toml"
      - "cf-proxy/package.json"
      - "cf-proxy/bun.lock"
      - ".github/workflows/d1-migrations.yml"
  workflow_dispatch:
    inputs:
      sync_scope:
        description: Data set to synchronize
        required: true
        default: stock_only
        type: choice
        options:
          - derived
          - stock_only
          - full_catalog
      derived_tables:
        description: Comma-separated derived tables to rebuild and upload
        required: true
        default: photo_diode
        type: string
      cache_bust_url:
        description: Production URL to refresh after the D1 upload
        required: false
        default: ""
        type: string
      smoke_test_lcsc:
        description: LCSC number used to verify catalog and stock syncs
        required: true
        default: "7512"
        type: string

permissions:
  contents: read

concurrency:
  group: production-d1-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Build database and sync production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SYNC_SCOPE: ${{ github.event_name == 'schedule' && 'stock_only' || inputs.sync_scope || 'derived' }}
      DERIVED_TABLES_LIST: ${{ inputs.derived_tables || 'photo_diode,micro_usb_connector,barrel_jack' }}
      SMOKE_TEST_LCSC: ${{ inputs.smoke_test_lcsc || '7512' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Cloudflare credentials
        run: |
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          if [[ "${SYNC_SCOPE}" != "derived" && "${SYNC_SCOPE}" != "stock_only" && "${SYNC_SCOPE}" != "full_catalog" ]]; then
            echo "::error::Unknown sync scope: ${SYNC_SCOPE}"
            exit 1
          fi
          if [[ "${SYNC_SCOPE}" == "derived" && -z "${DERIVED_TABLES_LIST}" ]]; then
            echo "::error::At least one derived table is required."
            exit 1
          fi
          if [[ "${SYNC_SCOPE}" != "derived" && ! "${SMOKE_TEST_LCSC}" =~ ^[0-9]+$ ]]; then
            echo "::error::smoke_test_lcsc must be numeric."
            exit 1
          fi

      - name: Install database pipeline dependencies
        run: bun install

      - name: Install Cloudflare worker dependencies
        working-directory: cf-proxy
        run: bun install --frozen-lockfile

      - name: Generate daily database cache key
        id: cache-date
        run: echo "bucket=$(($(date -u +%s) / 86400))" >> "${GITHUB_OUTPUT}"

      - name: Cache prepared SQLite database
        id: cache-database
        uses: actions/cache@v4
        with:
          path: db.sqlite3
          key: prepared-db-${{ runner.os }}-${{ env.SYNC_SCOPE }}-${{ env.DERIVED_TABLES_LIST }}-${{ steps.cache-date.outputs.bucket }}-${{ hashFiles('package.json', 'bunfig.toml', 'scripts/**', 'lib/**') }}

      - name: Build prepared SQLite database
        if: steps.cache-database.outputs.cache-hit != 'true'
        run: |
          bun run setup:7z
          bun run setup:download-cache-fragments
          bun run setup:extract-db
          if [[ "${SYNC_SCOPE}" == "full_catalog" ]]; then
            INCLUDE_COMPONENT_CATALOG=1 bun run setup:derived-sync-db
          elif [[ "${SYNC_SCOPE}" == "stock_only" ]]; then
            INCLUDE_STOCK_SNAPSHOT=1 bun run setup:derived-sync-db
          else
            bun run setup:derived-sync-db
          fi
          rm -f cache.sqlite3
          rm -rf .buildtmp

      - name: Verify prepared derived tables
        run: |
          if [[ ! -s db.sqlite3 ]]; then
            echo "::error::Database setup did not create db.sqlite3."
            exit 1
          fi

          integrity_check="$(sqlite3 db.sqlite3 "PRAGMA integrity_check;")"
          if [[ "${integrity_check}" != "ok" ]]; then
            echo "::error::Prepared database failed its integrity check: ${integrity_check}"
            exit 1
          fi

          if [[ "${SYNC_SCOPE}" == "full_catalog" ]]; then
            catalog_exists="$(sqlite3 db.sqlite3 "SELECT EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='component_catalog');")"
            if [[ "${catalog_exists}" != "1" ]]; then
              echo "::error::Prepared database does not contain component_catalog."
              exit 1
            fi

            catalog_count="$(sqlite3 db.sqlite3 "SELECT COUNT(*) FROM component_catalog;")"
            if [[ "${catalog_count}" == "0" ]]; then
              echo "::error::Refusing to replace component_catalog with an empty table."
              exit 1
            fi

            extended_promotional_count="$(sqlite3 db.sqlite3 "SELECT COUNT(*) FROM component_catalog WHERE is_extended_promotional=1;")"
            if [[ "${extended_promotional_count}" == "0" ]]; then
              echo "::error::Prepared catalog contains no extended promotional components."
              exit 1
            fi

            classification_mismatches="$(sqlite3 db.sqlite3 "SELECT COUNT(*) FROM component_catalog WHERE coalesce(is_extended_promotional, -1) <> CASE WHEN basic=0 AND preferred=1 THEN 1 ELSE 0 END;")"
            if [[ "${classification_mismatches}" != "0" ]]; then
              echo "::error::Prepared catalog contains ${classification_mismatches} inconsistent extended promotional classifications."
              exit 1
            fi

            smoke_test_count="$(sqlite3 db.sqlite3 "SELECT COUNT(*) FROM component_catalog WHERE lcsc=${SMOKE_TEST_LCSC};")"
            if [[ "${smoke_test_count}" != "1" ]]; then
              echo "::error::Prepared catalog does not contain C${SMOKE_TEST_LCSC}."
              exit 1
            fi
            echo "component_catalog: ${catalog_count} prepared rows (${extended_promotional_count} extended promotional)"
          elif [[ "${SYNC_SCOPE}" == "stock_only" ]]; then
            stock_snapshot_exists="$(sqlite3 db.sqlite3 "SELECT EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='component_stock');")"
            if [[ "${stock_snapshot_exists}" != "1" ]]; then
              echo "::error::Prepared database does not contain component_stock."
              exit 1
            fi

            stock_snapshot_count="$(sqlite3 db.sqlite3 "SELECT COUNT(*) FROM component_stock;")"
            if [[ "${stock_snapshot_count}" == "0" ]]; then
              echo "::error::Refusing to sync an empty stock snapshot."
              exit 1
            fi

            smoke_test_count="$(sqlite3 db.sqlite3 "SELECT COUNT(*) FROM component_stock WHERE lcsc=${SMOKE_TEST_LCSC};")"
            if [[ "${smoke_test_count}" != "1" ]]; then
              echo "::error::Prepared stock snapshot does not contain C${SMOKE_TEST_LCSC}."
              exit 1
            fi
            echo "component_stock: ${stock_snapshot_count} prepared rows"
          else
            IFS=',' read -ra tables <<< "${DERIVED_TABLES_LIST}"
            for raw_table in "${tables[@]}"; do
              table="$(echo "${raw_table}" | xargs)"
              if [[ ! "${table}" =~ ^[a-z0-9_]+$ ]]; then
                echo "::error::Invalid derived table name: ${table}"
                exit 1
              fi

              table_exists="$(sqlite3 db.sqlite3 "SELECT EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='${table}');")"
              if [[ "${table_exists}" != "1" ]]; then
                echo "::error::Prepared database does not contain ${table}."
                exit 1
              fi

              row_count="$(sqlite3 db.sqlite3 "SELECT COUNT(*) FROM \"${table}\";")"
              if [[ "${row_count}" == "0" ]]; then
                echo "::error::Refusing to replace ${table} with an empty table."
                exit 1
              fi
              echo "${table}: ${row_count} prepared rows"
            done
          fi

      - name: Apply D1 migrations
        working-directory: cf-proxy
        run: bash scripts/retry-command.sh bunx wrangler d1 migrations apply jlcsearch --remote

      - name: Upload selected data to D1
        if: env.SYNC_SCOPE != 'stock_only'
        env:
          SOURCE_DB_PATH: ${{ github.workspace }}/db.sqlite3
          REBUILD_DERIVED_TABLES: "0"
          REBUILD_COMPONENT_CATALOG: "0"
          SYNC_DERIVED_TABLES: ${{ env.SYNC_SCOPE == 'derived' && '1' || '0' }}
          SYNC_COMPONENT_CATALOG: ${{ env.SYNC_SCOPE == 'full_catalog' && '1' || '0' }}
          SYNC_SEARCH_INDEX: ${{ env.SYNC_SCOPE == 'full_catalog' && '1' || '0' }}
          COMPONENT_CATALOG_BATCH_ROWS: ${{ env.SYNC_SCOPE == 'full_catalog' && '1000' || '250' }}
          SEARCH_INDEX_BATCH_ROWS: ${{ env.SYNC_SCOPE == 'full_catalog' && '1000' || '250' }}
          FTS_BATCH_ROWS: ${{ env.SYNC_SCOPE == 'full_catalog' && '5000' || '25000' }}
          RETRY_MAX_ATTEMPTS: ${{ env.SYNC_SCOPE == 'full_catalog' && '6' || '3' }}
          RETRY_BASE_DELAY_SECONDS: ${{ env.SYNC_SCOPE == 'full_catalog' && '20' || '30' }}
        run: bash ./cf-proxy/scripts/sync-db.sh

      - name: Sync stock quantities to D1
        if: env.SYNC_SCOPE == 'stock_only'
        env:
          SOURCE_DB_PATH: ${{ github.workspace }}/db.sqlite3
          STOCK_BATCH_ROWS: "1000"
          RETRY_MAX_ATTEMPTS: "6"
          RETRY_BASE_DELAY_SECONDS: "20"
        run: bash ./cf-proxy/scripts/sync-stock.sh

      - name: Verify migration status and remote row counts
        working-directory: cf-proxy
        run: |
          bash scripts/retry-command.sh bunx wrangler d1 migrations list jlcsearch --remote

          if [[ "${SYNC_SCOPE}" == "full_catalog" ]]; then
            bash scripts/retry-command.sh bunx wrangler d1 execute jlcsearch --remote \
              --command "SELECT COUNT(*) AS row_count FROM component_catalog;"
            bash scripts/retry-command.sh bunx wrangler d1 execute jlcsearch --remote \
              --command "SELECT COUNT(*) AS row_count FROM search_index;"
          fi

          if [[ "${SYNC_SCOPE}" != "derived" ]]; then
            source_stock_table="component_catalog"
            if [[ "${SYNC_SCOPE}" == "stock_only" ]]; then
              source_stock_table="component_stock"
            fi
            expected_stock="$(sqlite3 ../db.sqlite3 "SELECT stock FROM ${source_stock_table} WHERE lcsc=${SMOKE_TEST_LCSC};")"
            remote_result_file="${RUNNER_TEMP}/jlcsearch-remote-stock.json"
            bash scripts/retry-command.sh bunx wrangler d1 execute jlcsearch --remote --json \
              --command "SELECT lcsc, mfr, stock FROM search_index WHERE lcsc=${SMOKE_TEST_LCSC};" \
              > "${remote_result_file}"
            remote_stock="$(jq -r '.[0].results[0].stock // empty' "${remote_result_file}")"
            if [[ -z "${expected_stock}" || "${remote_stock}" != "${expected_stock}" ]]; then
              echo "::error::Remote C${SMOKE_TEST_LCSC} stock ${remote_stock:-missing} did not match source stock ${expected_stock:-missing}."
              cat "${remote_result_file}"
              exit 1
            fi
            echo "Remote C${SMOKE_TEST_LCSC} stock matches source: ${expected_stock}."
          else
            IFS=',' read -ra tables <<< "${DERIVED_TABLES_LIST}"
            for raw_table in "${tables[@]}"; do
              table="$(echo "${raw_table}" | xargs)"
              bash scripts/retry-command.sh bunx wrangler d1 execute jlcsearch --remote \
                --command "SELECT COUNT(*) AS row_count FROM \"${table}\";"
            done
          fi

      - name: Clear production API cache
        if: env.SYNC_SCOPE != 'derived'
        working-directory: cf-proxy
        shell: bash
        run: |
          cache_keys_file="${RUNNER_TEMP}/jlcsearch-cache-keys.json"
          bash scripts/retry-command.sh bunx wrangler kv key list \
            --binding CACHE_KV > "${cache_keys_file}"

          cache_key_count="$(jq 'length' "${cache_keys_file}")"
          if [[ "${cache_key_count}" == "0" ]]; then
            echo "Production API cache is already empty."
            exit 0
          fi

          echo "Deleting ${cache_key_count} cached API responses."
          bash scripts/retry-command.sh bunx wrangler kv bulk delete \
            "${cache_keys_file}" \
            --binding CACHE_KV \
            --force

      - name: Refresh and verify the production API cache
        env:
          CACHE_BUST_URL: ${{ inputs.cache_bust_url }}
        shell: bash
        run: |
          if [[ -z "${CACHE_BUST_URL}" ]]; then
            if [[ "${SYNC_SCOPE}" != "derived" ]]; then
              CACHE_BUST_URL="https://jlcsearch.tscircuit.com/components/list?search=C${SMOKE_TEST_LCSC}&json=true"
            elif [[ ",${DERIVED_TABLES_LIST}," == *",barrel_jack,"* ]]; then
              CACHE_BUST_URL="https://jlcsearch.tscircuit.com/barrel_jacks/list.json"
            elif [[ ",${DERIVED_TABLES_LIST}," == *",micro_usb_connector,"* ]]; then
              CACHE_BUST_URL="https://jlcsearch.tscircuit.com/micro_usb_connectors/list.json"
            else
              CACHE_BUST_URL="https://jlcsearch.tscircuit.com/photo_diodes/list.json"
            fi
          fi

          separator="?"
          if [[ "${CACHE_BUST_URL}" == *"?"* ]]; then
            separator="&"
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            "${CACHE_BUST_URL}${separator}cachebust=1" \
            --output /tmp/d1-sync-response.json

          if [[ "${CACHE_BUST_URL}" == *"/hdmi_ports/list.json"* ]]; then
            hdmi_port_count="$(jq '.hdmi_ports | length' /tmp/d1-sync-response.json)"
            if [[ "${hdmi_port_count}" == "0" || "${hdmi_port_count}" == "null" ]]; then
              echo "::error::Production HDMI API still returned no ports."
              cat /tmp/d1-sync-response.json
              exit 1
            fi
            echo "Production HDMI API returned ${hdmi_port_count} ports."
          fi

          if [[ "${CACHE_BUST_URL}" == *"/micro_usb_connectors/list.json"* ]]; then
            micro_usb_connector_count="$(jq '.micro_usb_connectors | length' /tmp/d1-sync-response.json)"
            if [[ "${micro_usb_connector_count}" == "0" || "${micro_usb_connector_count}" == "null" ]]; then
              echo "::error::Production Micro USB API still returned no connectors."
              cat /tmp/d1-sync-response.json
              exit 1
            fi
            echo "Production Micro USB API returned ${micro_usb_connector_count} connectors."
          fi

          if [[ "${CACHE_BUST_URL}" == *"/barrel_jacks/list.json"* ]]; then
            barrel_jack_count="$(jq '.barrel_jacks | length' /tmp/d1-sync-response.json)"
            if [[ "${barrel_jack_count}" == "0" || "${barrel_jack_count}" == "null" ]]; then
              echo "::error::Production Barrel Jacks API still returned no connectors."
              cat /tmp/d1-sync-response.json
              exit 1
            fi
            echo "Production Barrel Jacks API returned ${barrel_jack_count} connectors."
          fi

          if [[ "${SYNC_SCOPE}" != "derived" ]]; then
            component_count="$(jq '.components | length' /tmp/d1-sync-response.json)"
            if [[ "${component_count}" == "0" || "${component_count}" == "null" ]]; then
              echo "::error::Production component API did not return C${SMOKE_TEST_LCSC}."
              cat /tmp/d1-sync-response.json
              exit 1
            fi
            source_stock_table="component_catalog"
            if [[ "${SYNC_SCOPE}" == "stock_only" ]]; then
              source_stock_table="component_stock"
            fi
            expected_stock="$(sqlite3 db.sqlite3 "SELECT stock FROM ${source_stock_table} WHERE lcsc=${SMOKE_TEST_LCSC};")"
            api_stock="$(jq -r '.components[0].stock // empty' /tmp/d1-sync-response.json)"
            if [[ -z "${expected_stock}" || "${api_stock}" != "${expected_stock}" ]]; then
              echo "::error::Production C${SMOKE_TEST_LCSC} stock ${api_stock:-missing} did not match source stock ${expected_stock:-missing}."
              cat /tmp/d1-sync-response.json
              exit 1
            fi
            echo "Cache-busted production API returned expected C${SMOKE_TEST_LCSC} stock ${expected_stock}."

            curl --fail --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 10 \
              "${CACHE_BUST_URL}" \
              --output /tmp/d1-sync-cached-response.json

            cached_api_stock="$(jq -r '.components[0].stock // empty' /tmp/d1-sync-cached-response.json)"
            if [[ "${cached_api_stock}" != "${expected_stock}" ]]; then
              echo "::error::Cached production C${SMOKE_TEST_LCSC} stock ${cached_api_stock:-missing} did not match source stock ${expected_stock}."
              cat /tmp/d1-sync-cached-response.json
              exit 1
            fi
            echo "Cached production API returned expected C${SMOKE_TEST_LCSC} stock ${expected_stock}."
          fi
