name: Verify live inventory activation
on:
  push:
    branches: [ops/activate-live-inventory]
    paths: [.github/workflows/activate-live-inventory.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-d1-sync
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd cf-proxy --frozen-lockfile
      - name: Clear production response cache after first crawl
        working-directory: cf-proxy
        run: |
          cache_keys_file="${RUNNER_TEMP}/activation-cache-keys.json"
          bash scripts/retry-command.sh bunx wrangler kv key list --binding CACHE_KV > "${cache_keys_file}"
          if [[ "$(jq 'length' "${cache_keys_file}")" != "0" ]]; then
            bash scripts/retry-command.sh bunx wrangler kv bulk delete "${cache_keys_file}" --binding CACHE_KV --force
          fi
      - name: Read live observation sample
        working-directory: cf-proxy
        run: |
          bash scripts/retry-command.sh bunx wrangler d1 execute jlcsearch --remote --json --command "SELECT c.lcsc,c.stock,o.observed_stock,o.checked_at FROM component_catalog c JOIN _jlcsearch_live_stock o ON o.lcsc=c.lcsc WHERE o.observed_stock>0 AND c.stock=o.observed_stock ORDER BY o.checked_at DESC LIMIT 1;" > "${RUNNER_TEMP}/live-stock-verification.json"
      - name: Verify cached and uncached API against live stock
        run: |
          bun -e '
            const data=JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/live-stock-verification.json").text());
            const row=data[0].results[0];
            if (!row || row.checked_at < Date.now()/1000 - 3600) throw new Error("No recent live observation");
            console.log(JSON.stringify({liveObservation:row}));
            for (const lcsc of [221660,row.lcsc]) {
              for (const suffix of ["&cachebust="+Date.now(),""]) {
                const response=await fetch("https://jlcsearch.tscircuit.com/components/list?json=true&search=C"+lcsc+suffix);
                const body=await response.json();
                const match=body.components?.find(c=>c.lcsc===lcsc);
                console.log(JSON.stringify({lcsc,status:response.status,cacheControl:response.headers.get("cache-control"),stock:match?.stock,componentCount:body.components?.length}));
                if (!response.ok || !Array.isArray(body.components)) throw new Error("Invalid production API response");
                if (lcsc===221660 ? !!match : match?.stock !== row.observed_stock) throw new Error("Production API disagrees with live stock");
              }
            }
          '
